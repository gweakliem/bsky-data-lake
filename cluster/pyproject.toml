[project]
name = "bsky-cluster"
version = "0.1.0"
description = "Prototype: stories (text-embedding clusters) and communities (likes-graph SVD)"
authors = [
    { name = "Gordon Weakliem", email = "gordon.weakliem@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bsky-embed",
    "bsky-enrich",
    "duckdb>=1.4.0",
    "numpy>=2.5.4",
    "pyarrow>=22.0.0",
    "pyiceberg[glue,pyarrow]>=0.12.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
    "stopwordsiso>=0.7.1",
    "umap-learn>=0.5.9",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
bsky-embed = { path = "../embed", editable = true }
bsky-enrich = { path = "../enrich", editable = true }
