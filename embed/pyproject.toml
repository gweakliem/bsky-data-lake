[project]
name = "bsky-embed"
version = "0.1.0"
description = "The embedding job (E2) and the model-selection harness (E1)"
authors = [
    { name = "Gordon Weakliem", email = "gordon.weakliem@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bsky-enrich",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# The E1 harness only (local models, BM25, clustering); the E2 job's image leaves it out.
eval = [
    "bm25s>=0.3.16",
    "einops>=0.8.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]
dev = [
    "pytest>=9.2.0",
    { include-group = "eval" },
]

[tool.uv.sources]
bsky-enrich = { path = "../enrich", editable = true }
