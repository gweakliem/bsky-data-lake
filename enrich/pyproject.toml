[project]
name = "bsky-enrich"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gordon Weakliem", email = "gordon.weakliem@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb==1.4.*",
    "pyiceberg[glue,pyarrow]>=0.12.0",
