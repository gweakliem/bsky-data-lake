    "typesafe-sdk>=0.7.5",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyiceberg[sql-sqlite]>=0.12.0",
    "pytest>=9.2.0",
]
