# The data lake's member account (WP M5, docs/plans/account-management.md).
# Use the bsky-data-lake SSO profile and that account's state bucket.
config:
  aws:region: us-west-2
  aws:defaultTags:
    tags:
      project: bsky-data-lake
      stack: data
  # Create the raw and warehouse buckets, named from this account's ID,
  # instead of importing the original account's (ignores BSKY_BUCKET /
  # BSKY_WAREHOUSE_BUCKET in .env).
  bsky-data-lake:createBuckets: "true"
  bsky-data-lake:manageIam: "true"
  # Job alarms notify (phase E of the move: the copied tables exist and the jobs run).
  bsky-data-lake:embedAlarmActions: "true"
  bsky-data-lake:indexAlarmActions: "true"
  bsky-data-lake:labelsAlarmActions: "true"
  # WP M5: the copy job's role (reads the old warehouse named in .env).
  bsky-data-lake:migrationRole: "true"
