[project]
name = "bsky-data-lake-platform"
description = "Pulumi stack for the data lake's shared platform (VPC, EKS, ECR)"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pulumi>=3.273.0",
    "pulumi-aws>=7.52.1",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:pulumi_aws.*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
